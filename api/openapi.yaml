openapi: 3.0.3
info:
  title: Soma API
  version: 0.2.0
  description: |
    The Soma REST API. Every operation declares `x-soma-permission`, the
    permission a caller needs (`public` for unauthenticated endpoints).

    Until identity is built (ADR-014) every request acts as the local owner.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

paths:
  /api/v1/meta:
    get:
      operationId: getMeta
      summary: Instance information
      description: Public information about this Soma instance.
      tags: [meta]
      x-soma-permission: public
      responses:
        "200":
          description: Instance information.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meta"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/bodymap:
    get:
      operationId: getBodyMap
      summary: The body map
      description: |
        Every area of life with its status, in one response. Areas whose module
        isn't built yet have `enabled: false` and status `unknown`.
      tags: [bodymap]
      x-soma-permission: bodymap:read
      responses:
        "200":
          description: The body map.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BodyMap"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/people/contacts:
    get:
      operationId: listContacts
      summary: List contacts
      description: Newest first. Pass `next_cursor` back as `cursor` to get the next page.
      tags: [people]
      x-soma-permission: people:read
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: A page of contacts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createContact
      summary: Create a contact
      tags: [people]
      x-soma-permission: people:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactInput"
      responses:
        "201":
          description: The created contact.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/people/contacts/{id}:
    get:
      operationId: getContact
      summary: Get a contact
      tags: [people]
      x-soma-permission: people:read
      parameters:
        - $ref: "#/components/parameters/ContactId"
      responses:
        "200":
          description: The contact.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateContact
      summary: Update a contact
      description: |
        JSON Merge Patch (RFC 7396). Send only the fields to change. `null`
        clears a field. The request must carry `If-Match` with the `ETag` of
        the version being edited; otherwise, or if that version is stale, the
        server answers 412.
      tags: [people]
      x-soma-permission: people:write
      parameters:
        - $ref: "#/components/parameters/ContactId"
        - name: If-Match
          in: header
          required: false
          description: The ETag of the version being edited, for example `"3"`.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactPatch"
      responses:
        "200":
          description: The updated contact.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteContact
      summary: Move a contact to the trash
      description: The contact is hidden and can be restored from the trash (X-07) once that exists.
      tags: [people]
      x-soma-permission: people:write
      parameters:
        - $ref: "#/components/parameters/ContactId"
      responses:
        "204":
          description: Moved to the trash.
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/journal/entries:
    get:
      operationId: listJournalEntries
      summary: List your journal entries
      description: Only your own entries are listed; other members never see them.
      tags: [journal]
      x-soma-permission: journal:read
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: A page of entries, newest saved first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntryList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createJournalEntry
      summary: Write an entry
      tags: [journal]
      x-soma-permission: journal:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JournalEntryInput"
      responses:
        "201":
          description: The saved entry.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/journal/entries/{id}:
    get:
      operationId: getJournalEntry
      summary: Read an entry
      tags: [journal]
      x-soma-permission: journal:read
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: The entry.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateJournalEntry
      summary: Edit an entry
      description: |
        JSON Merge Patch. Send only the fields to change; `null` clears one.
        Requires `If-Match` with the entry's current ETag; otherwise 412.
      tags: [journal]
      x-soma-permission: journal:write
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MergePatch"
      responses:
        "200":
          description: The updated entry.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteJournalEntry
      summary: Move an entry to the trash
      tags: [journal]
      x-soma-permission: journal:write
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "204":
          description: Moved to the trash.
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/tasks:
    get:
      operationId: listTasks
      summary: List tasks
      tags: [tasks]
      x-soma-permission: tasks:read
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: open_only
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: A page of tasks, newest saved first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createTask
      summary: Add a task
      tags: [tasks]
      x-soma-permission: tasks:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: The new task.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/tasks/{id}:
    get:
      operationId: getTask
      summary: Read a task
      tags: [tasks]
      x-soma-permission: tasks:read
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: The task.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateTask
      summary: Edit a task
      description: JSON Merge Patch with `If-Match`, as for journal entries.
      tags: [tasks]
      x-soma-permission: tasks:write
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MergePatch"
      responses:
        "200":
          description: The updated task.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteTask
      summary: Move a task to the trash
      tags: [tasks]
      x-soma-permission: tasks:write
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "204":
          description: Moved to the trash.
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/tasks/{id}/complete:
    post:
      operationId: completeTask
      summary: Mark a task done
      tags: [tasks]
      x-soma-permission: tasks:write
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: The task, now done.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/tasks/{id}/reopen:
    post:
      operationId: reopenTask
      summary: Mark a done task open again
      tags: [tasks]
      x-soma-permission: tasks:write
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: The task, open again.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/self:
    get:
      operationId: getSelfProfile
      summary: Read your Self profile
      tags: [self]
      x-soma-permission: self:read
      responses:
        "200":
          description: The profile.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SelfProfile"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateSelfProfile
      summary: Edit your Self profile
      description: JSON Merge Patch with `If-Match`, as for journal entries.
      tags: [self]
      x-soma-permission: self:write
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MergePatch"
      responses:
        "200":
          description: The updated profile.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SelfProfile"
        default:
          $ref: "#/components/responses/Problem"

components:
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: The ETag of the version being edited, for example "3".
      schema:
        type: string
    ContactId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  headers:
    ETag:
      description: The version of the resource, quoted, for use in `If-Match`.
      schema:
        type: string
        example: '"3"'

  schemas:
    JournalEntry:
      type: object
      required: [id, entry_date, body, created_at, updated_at, version]
      properties:
        id:
          type: string
          format: uuid
        entry_date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: The day the entry is about, YYYY-MM-DD.
        title:
          type: string
          maxLength: 200
        body:
          type: string
          maxLength: 100000
        mood:
          type: integer
          minimum: 1
          maximum: 5
          description: How the day felt, from 1 (low) to 5 (high).
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1

    JournalEntryInput:
      type: object
      additionalProperties: false
      required: [entry_date, body]
      properties:
        entry_date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        title:
          type: string
          maxLength: 200
        body:
          type: string
          maxLength: 100000
        mood:
          type: integer
          minimum: 1
          maximum: 5

    JournalEntryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/JournalEntry"
        next_cursor:
          type: string
          format: uuid

    Task:
      type: object
      required: [id, title, completed, overdue, created_at, updated_at, version]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 200
        notes:
          type: string
          maxLength: 5000
        due_on:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        completed:
          type: boolean
        completed_at:
          type: string
          format: date-time
        overdue:
          type: boolean
          description: Open and due before today.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1

    TaskInput:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          maxLength: 200
        notes:
          type: string
          maxLength: 5000
        due_on:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'

    TaskList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Task"
        next_cursor:
          type: string
          format: uuid

    SelfProfile:
      type: object
      required: [version, updated_at]
      properties:
        preferred_name:
          type: string
          maxLength: 100
        birth_date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        core_values:
          type: string
          maxLength: 2000
          description: What matters most to you, in your own words.
        bio:
          type: string
          maxLength: 5000
        updated_at:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1

    MergePatch:
      type: object
      description: Fields to change. A null value clears the field. Unknown fields are refused.
      additionalProperties: {}

    Meta:
      type: object
      additionalProperties: false
      required: [name, version, mode]
      properties:
        name:
          type: string
          example: Soma
        version:
          type: string
          example: 0.1.0
        mode:
          type: string
          enum: [local, private, public]

    Contact:
      type: object
      required: [id, display_name, created_at, updated_at, version]
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
          maxLength: 200
        nickname:
          type: string
          maxLength: 100
        email:
          type: string
          maxLength: 254
        phone:
          type: string
          maxLength: 40
        birthday:
          type: string
          description: Calendar date in the user's timezone, YYYY-MM-DD.
          pattern: '^\d{4}-\d{2}-\d{2}$'
        how_we_met:
          type: string
          maxLength: 500
        notes:
          type: string
          maxLength: 10000
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1

    ContactInput:
      type: object
      additionalProperties: false
      required: [display_name]
      properties:
        display_name:
          type: string
          maxLength: 200
        nickname:
          type: string
          maxLength: 100
        email:
          type: string
          maxLength: 254
        phone:
          type: string
          maxLength: 40
        birthday:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        how_we_met:
          type: string
          maxLength: 500
        notes:
          type: string
          maxLength: 10000

    ContactPatch:
      type: object
      description: Fields to change. A `null` value clears the field.
      additionalProperties:
        type: string
        nullable: true
        maxLength: 10000

    BodyMap:
      type: object
      required: [as_of, areas]
      properties:
        as_of:
          type: string
          format: date-time
        areas:
          type: array
          items:
            $ref: "#/components/schemas/BodyArea"

    BodyArea:
      type: object
      required: [key, phase, status, enabled, counts]
      properties:
        key:
          type: string
          enum: [mind, self, responsibilities, heart, body, work, money, growth, journeys, home, papers]
        phase:
          type: string
          enum: [P1, P2, P3]
          description: The release that delivers this area.
        status:
          type: string
          enum: [calm, attention, urgent, unknown]
          description: "`unknown` means the area isn't enabled yet."
        enabled:
          type: boolean
        counts:
          type: object
          description: Figures behind the status, keyed by name.
          additionalProperties:
            type: integer

    ContactList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Contact"
        next_cursor:
          type: string
          format: uuid
          description: Pass as `cursor` to get the next page. Absent on the last page.

    Problem:
      description: RFC 9457 problem details.
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
          example: Not Found
        status:
          type: integer
          example: 404
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: Stable machine-readable error code.
          example: request.not_found
        request_id:
          type: string
        errors:
          type: object
          description: Per-field validation messages keyed by JSON field name.
          additionalProperties:
            type: string

  responses:
    Problem:
      description: An error, as RFC 9457 problem details.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
