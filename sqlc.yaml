# Generates typed Go from SQL (CLAUDE.md: no SQL built by string concatenation).
# Run with: go tool task gen:sql (uses the pinned sqlc Docker image, ADR-013).
version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: queries/core
    gen:
      go:
        package: store
        out: internal/core/store
        sql_package: pgx/v5
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
          - db_type: text
            nullable: true
            go_type:
              type: string
              pointer: true
  - engine: postgresql
    schema: migrations
    queries: queries/people
    gen:
      go:
        package: store
        out: internal/modules/people/store
        sql_package: pgx/v5
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: date
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
          - db_type: text
            nullable: true
            go_type:
              type: string
              pointer: true
